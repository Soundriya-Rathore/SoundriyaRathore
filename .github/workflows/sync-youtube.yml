name: Auto-Sync Latest YouTube Videos & Sitemap

on:
  schedule:
    # Runs every 30 minutes automatically
    - cron: '*/30 * * * *'
  # Allows you to click "Run workflow" manually in GitHub Actions tab anytime!
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest YouTube Videos & Update Config & Sitemap
        run: node scripts/sync-youtube.js

      - name: Commit and Push Changes If Any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/config.js sitemap.xml
          if git diff --staged --quiet; then
            echo "No new YouTube videos detected. Everything up to date."
          else
            echo "New YouTube videos detected! Committing changes..."
            git commit -m "chore: auto-sync latest YouTube videos and sitemap [skip ci]"
            git push
          fi
